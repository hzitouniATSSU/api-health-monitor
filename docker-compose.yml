services:
  db:
    image: postgres:17
    container_name: api-health-monitor-db
    environment:
      POSTGRES_USER: healthmonitor
      POSTGRES_PASSWORD: healthmonitor
      POSTGRES_DB: healthmonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthmonitor -d healthmonitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: